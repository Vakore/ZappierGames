plugins {
    id 'java'
}

group = 'org.zappier'
version = '1.25-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    // Paper 26.3 (experimental channel at time of writing). Adventure 5.x, Gson, Guava, etc.
    // come in transitively - do NOT pin adventure-api / minimessage separately.
    // After the first Gradle sync, pin this to the exact resolved build for reproducible builds,
    // e.g. 'io.papermc.paper:paper-api:26.3.build.17-alpha'.
    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}