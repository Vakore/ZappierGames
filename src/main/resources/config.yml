# Collections – flexible system
# NOTE: potions already work as collection items today - no special syntax needed. Reference
# them by their potion type key (matches potion-values below), optionally prefixed SPLASH_ or
# LINGERING_ for those variants, e.g. STRENGTH / SPLASH_HEALING / LINGERING_SWIFTNESS. Use the
# "|" variant syntax to treat different brew strengths/forms as the same collection slot, e.g.
# "STRENGTH|LONG_STRENGTH|STRONG_STRENGTH|SPLASH_STRENGTH|LINGERING_STRENGTH". Example below
# (disabled by default - uncomment to enable):
#  notable_potions:
#    name: "Notable Potions"
#    type: complete
#    items:
#      - "STRENGTH|LONG_STRENGTH|STRONG_STRENGTH|SPLASH_STRENGTH|LINGERING_STRENGTH"
#      - "REGENERATION|LONG_REGENERATION|STRONG_REGENERATION|SPLASH_REGENERATION|LINGERING_REGENERATION"
#      - "HEALING|STRONG_HEALING|SPLASH_HEALING|LINGERING_HEALING"
#      - "FIRE_RESISTANCE|LONG_FIRE_RESISTANCE|SPLASH_FIRE_RESISTANCE|LINGERING_FIRE_RESISTANCE"
#    bonus: 100
