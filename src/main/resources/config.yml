# Sorts whatever's ALREADY in the infinibundle so strategic items float to the front (earliest
# pages) instead of needing to page through everything to find them - this does NOT add or give
# any items. A stored item is matched against these groups in order; the first group it matches
# decides its sort position (earlier group = earlier page). Items matching no group keep their
# existing relative order, after all matched items. Each group can match by exact material
# (materials: [...]), by having a specific enchantment regardless of the base item (enchantment:
# NAME - e.g. any tool with Silk Touch, not just a specific pickaxe), or by being food
# (edible: true, using Minecraft's own edibility rather than a hardcoded food list).
infinibundle-priority-order:
  enabled: true
  groups:
    - name: "Silk Touch Tools"
      enchantment: SILK_TOUCH
    - name: "Fortune Tools"
      enchantment: FORTUNE
    - name: "Crafting Tables"
      materials: [CRAFTING_TABLE]
    - name: "Furnaces"
      materials: [FURNACE]
    - name: "Food"
      edible: true
    - name: "Buckets"
      materials: [BUCKET, WATER_BUCKET, LAVA_BUCKET, MILK_BUCKET, POWDER_SNOW_BUCKET,
                  PUFFERFISH_BUCKET, SALMON_BUCKET, COD_BUCKET, TROPICAL_FISH_BUCKET,
                  AXOLOTL_BUCKET, TADPOLE_BUCKET]
    - name: "Iron Ore"
      materials: [IRON_ORE, DEEPSLATE_IRON_ORE, RAW_IRON]
    - name: "Iron Ingots"
      materials: [IRON_INGOT]