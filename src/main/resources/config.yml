  points-per-tier: 2
  special-enchantments:
    MENDING: 7.5
    FROST_WALKER: 7.5
    WIND_BURST: 249
    SWIFT_SNEAK: 2

# Enchantment collection - a one-time bonus per unique enchantment currently held on any item
# (personal inventory + team storage), like a collection but auto-derived rather than a manual
# item list. Recomputed from current holdings each time, so losing every item with an
# enchantment also loses that bonus (consistent with how item collections already work).
enchantment-collection:
  enabled: false
  # If true, enchanted books don't count toward this collection (only enchantments actually
  # applied to a usable item do).
  exclude-enchanted-books: false
  # If false (default): Lure I and Lure II both count as the same "Lure" entry, so only the
  # first one you hold grants the bonus. If true: Lure I, Lure II, Lure III etc. each count as
  # their own separate entry, so holding a higher level later grants its own bonus too.
  count-unique-levels: false
  bonuses:
    LURE: 20
    #MENDING: 20
    #SILK_TOUCH: 20

